<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (!localStorage.getItem("adminToken")) {
        window.location.href = "login.html";
      }
    </script>
    <title>Dashboard Admin HMIF</title>
    <link rel="stylesheet" href="../src/style.css" />
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  </head>
  <body>
    <header class="admin-header">
      <h1>Dashboard Admin HMIF</h1>
      <nav class="top-nav">
        <a href="../src/index.html" class="link-back">← Lihat Website</a>
        <button onclick="logout()" class="btn-logout">Logout</button>
      </nav>
    </header>

    <main class="admin-wrapper">
      <div class="container">
        <!-- Template untuk JavaScript agar JS tetap bersih -->
        <template id="loaderTemplate">
          <div class="loading-container">
            <div class="hmi-spinner"></div>
          </div>
        </template>

        <!-- Template untuk Item Kontrol Carousel -->
        <template id="carouselItemTemplate">
          <div
            class="d-flex justify-content-between align-items-center mb-2 p-2 border bg-white text-dark rounded"
          >
            <span class="slide-title"></span>
            <button class="btn btn-sm btn-danger btn-delete-carousel">
              Hapus
            </button>
          </div>
        </template>

        <!-- Template untuk Baris Tabel (Pengurus/Berita) -->
        <template id="tableRowTemplate">
          <tr>
            <td class="col-nama"></td>
            <td class="col-info"></td>
            <td class="col-aksi">
              <button class="btn-edit btn btn-sm btn-warning">Edit</button>
              <button class="btn-delete">Hapus</button>
            </td>
          </tr>
        </template>

        <!-- Template untuk Item Pengaduan -->
        <template id="pengaduanTemplate">
          <div class="admin-card card mb-3 fade-in">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="subject text-success fw-bold"></h6>
                  <p class="identitas small mb-1 text-white-50"></p>
                  <p class="description card-text text-white"></p>
                  <small class="timestamp text-muted"></small>
                </div>
                <button class="btn btn-sm btn-danger btn-delete-pengaduan">
                  Hapus
                </button>
              </div>
            </div>
          </div>
        </template>

        <!-- Template untuk Item Event -->
        <template id="eventTemplate">
          <div class="admin-card card mb-3 fade-in">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="event-judul text-success fw-bold"></h6>
                  <p class="event-info small mb-1 text-white-50"></p>
                  <small class="event-tanggal text-muted"></small>
                </div>
                <button class="btn btn-sm btn-danger btn-delete-event">
                  Hapus
                </button>
              </div>
            </div>
          </div>
        </template>

        <!-- Section Manajemen Carousel -->
        <div class="section">
          <h2>Manajemen Carousel Utama</h2>
          <form id="addCarouselForm">
            <input
              type="text"
              id="c_judul"
              placeholder="Judul Slide (Opsional)"
            />
            <input type="file" id="c_gambar" accept="image/*" required />
            <button type="submit">Tambah ke Carousel</button>
          </form>
          <div id="carouselControlList"></div>
        </div>

        <!-- Section Upload Dana -->
        <div class="section">
          <h2>Upload Dana</h2>
          <form id="addDanaForm">
            <input type="text" name="judul" placeholder="Judul Dana" required />
            <textarea name="deskripsi" placeholder="Deskripsi"></textarea>
            <input type="number" name="amount" placeholder="Jumlah" required />
            <input type="file" name="file" />
            <button type="submit">Upload Dana</button>
          </form>
          <div id="danaList"></div>
        </div>

        <!-- Section Upload Berita -->
        <div class="section">
          <h2>Upload Berita</h2>
          <form id="addBeritaForm">
            <input
              type="text"
              name="judul"
              placeholder="Judul Berita"
              required
            />
            <textarea
              name="konten"
              placeholder="Konten Berita"
              required
            ></textarea>
            <select id="b_bidang" required>
              <option value="" disabled selected>Pilih Bidang Berita</option>
              <option value="Umum">Berita Umum</option>
              <option value="AK">Administrasi & Kesekretariatan</option>
              <option value="PPPA">PPPA (Penelitian & Pembinaan)</option>
              <option value="PTKP">PTKP</option>
              <option value="KPP">Kewirausahaan (KPP)</option>
              <option value="KP">Keuangan & Perlengkapan</option>
              <option value="PP">Pemberdayaan Perempuan</option>
            </select>
            <input type="file" name="gambar" accept="image/*" />
            <button type="submit">Upload Berita</button>
          </form>
          <table class="admin-table">
            <thead>
              <tr>
                <th>Judul</th>
                <th>Bidang</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="beritaControlList"></tbody>
          </table>
        </div>

        <!-- Section Upload Buku -->
        <div class="section">
          <h2>Upload Buku</h2>
          <form id="addBukuForm">
            <input type="text" name="judul" placeholder="Judul Buku" required />
            <input type="text" name="penulis" placeholder="Penulis" />
            <input type="file" name="file" accept=".pdf,.doc,.docx" />
            <button type="submit">Upload Buku</button>
          </form>
          <div id="bukuList"></div>
        </div>

        <!-- Section Upload Proker -->
        <div class="section">
          <h2>Upload Proker</h2>
          <form id="addProkerForm">
            <input
              type="text"
              name="nama_proker"
              placeholder="Nama Proker"
              required
            />
            <select name="departemen_id" required>
              <option value="" disabled selected>
                Pilih Bidang/Departemen
              </option>
              <option value="AK">Administrasi & Kesekretariatan (AK)</option>
              <option value="KP">Keuangan & Perlengkapan (KP)</option>
              <option value="PPPA">PPPA (Penelitian & Pembinaan)</option>
              <option value="PTKP">PTKP</option>
              <option value="KPP">Kewirausahaan (KPP)</option>
              <option value="PP">Pemberdayaan Perempuan (PP)</option>
            </select>
            <textarea
              name="deskripsi"
              placeholder="Deskripsi Proker"
            ></textarea>
            <input type="file" name="gambar" accept="image/*" />
            <button type="submit">Upload Proker</button>
          </form>
          <div id="prokerList"></div>
        </div>

        <!-- Section Upload Event -->
        <div class="section">
          <h2>Upload Event</h2>
          <form id="addEventForm">
            <input
              type="text"
              name="judul"
              placeholder="Judul Event"
              required
            />
            <textarea name="deskripsi" placeholder="Deskripsi Event"></textarea>
            <input type="date" name="tanggal" required />
            <input
              type="text"
              name="lokasi"
              placeholder="Lokasi Event"
              required
            />
            <input type="file" name="gambar" accept="image/*" />
            <button type="submit">Upload Event</button>
          </form>
          <div id="eventList"></div>
        </div>

        <!-- Section Update Data Grafik Pertumbuhan -->
        <div class="section">
          <h2>Update Statistik Pertumbuhan</h2>
          <form id="updateGrowthForm">
            <input type="month" id="g_bulan" required />
            <input
              type="number"
              id="g_jumlah"
              placeholder="Total Kader/Anggota"
              required
            />
            <button type="submit">Update Grafik</button>
          </form>
          <p class="small text-muted">
            Data ini akan muncul secara real-time di halaman Home.
          </p>
        </div>

        <!-- List Pengaduan -->
        <div class="section">
          <h2>Daftar Pengaduan Masuk</h2>
          <div id="pengaduanList"></div>
        </div>
      </div>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
